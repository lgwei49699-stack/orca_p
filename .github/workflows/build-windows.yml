name: Build Windows x64

on:
  push:
    tags:
      - 'manual-build-windows-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: Build Windows x64
    uses: ./.github/workflows/build_check_cache.yml
    with:
      # Keep the VS2022 build on the Windows Server 2022 image. windows-latest
      # now provides Visual Studio 2026, which cannot satisfy the VS2022 generator.
      os: windows-2022
      build-deps-only: false
      force-build: false
    secrets: inherit
