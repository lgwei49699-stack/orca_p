name: Build Linux AppImage for x86_64

on:
  # 在默认分支手动运行一次可预热 Tag 构建能够读取的依赖和 ccache。
  workflow_dispatch:
    inputs:
      source_ref:
        description: '要预热的源码分支，例如 linux/release2_3_2；留空使用当前分支'
        required: false
        default: ''
  push:
    tags:
      - 'manual-build-linux-*'

concurrency:
  # Linux 打包很耗资源；新任务启动时取消仍在运行的旧任务。
  group: linux-appimage-x86_64
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    # 使用 Ubuntu 24.04 匹配服务器环境
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_ref || github.ref }}
        submodules: recursive
        fetch-depth: 0
    
    - name: Free up disk space
      shell: bash -e {0}
      run: |
        echo "=== Before cleanup ==="
        df -h /
        
        # 删除不需要的软件和镜像
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        
        # 清理 apt 缓存
        sudo apt-get clean
        
        echo ""
        echo "=== After cleanup ==="
        df -h /
    
    - name: Setup build info
      shell: bash -e {0}
      run: |
        echo "Building for Ubuntu 24.04 x86_64"
        echo "CPU cores: $(nproc)"
        echo "Available memory: $(free -h | grep Mem | awk '{print $2}')"
        uname -a
        cat /etc/os-release
    
    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-24.04-ccache
        max-size: 3G
        variant: ccache
        create-symlink: true

    # 只缓存依赖安装结果，不缓存 Ninja/CMake 的整个中间构建目录。
    # 精确命中时可以安全地完全跳过耗时的第三方依赖编译。
    - name: Cache compiled dependencies
      id: deps-cache
      uses: actions/cache@v4
      with:
        path: deps/build/destdir
        key: ${{ runner.os }}-24.04-x86_64-compiled-deps-v1-${{ hashFiles('deps/**') }}

    # 下载缓存允许使用旧缓存作为前缀匹配；依赖脚本会通过校验值保证源码包正确。
    - name: Cache dependency downloads
      uses: actions/cache@v4
      with:
        path: deps/DL_CACHE
        key: ${{ runner.os }}-24.04-x86_64-dep-downloads-v1-${{ hashFiles('deps/**') }}
        restore-keys: |
          ${{ runner.os }}-24.04-x86_64-dep-downloads-v1-
    
    - name: Install system dependencies
      shell: bash -e {0}
      run: |
        sudo ./build_linux.sh -u
        sudo apt-get install -y libunwind-dev
    
    - name: Configure ccache
      shell: bash -e {0}
      run: |
        # 配置 ccache
        ccache --set-config=max_size=3G
        ccache --set-config=compression=true
        ccache --set-config=compression_level=6
        ccache --zero-stats
        
        echo "CCache configured:"
        ccache --show-config
    
    - name: Build dependencies
      if: steps.deps-cache.outputs.cache-hit != 'true'
      shell: bash -e {0}
      run: |
        # 不在依赖构建阶段使用 ccache，避免与某些库的构建系统冲突
        export MAKEFLAGS="-j$(nproc)"
        
        echo "Building dependencies with $(nproc) parallel jobs..."
        ./build_linux.sh -d
    
    - name: Build OrcaSlicer and AppImage
      shell: bash -e {0}
      run: |
        # 在主程序编译时使用 ccache
        export PATH="/usr/lib/ccache:$PATH"
        export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)
        export CCACHE_BASEDIR="${GITHUB_WORKSPACE}"
        export CCACHE_COMPILERCHECK=content
        
        echo "Building OrcaSlicer and AppImage with $(nproc) parallel jobs and ccache..."
        # -p 关闭预编译头，提升后续 ccache 的命中率。
        time ./build_linux.sh -sip
    
    - name: Get version info
      id: version
      shell: bash -e {0}
      run: |
        set -o pipefail
        
        # 提取版本号
        VERSION=$(grep 'SoftFever_VERSION' version.inc | sed -n 's/.*"\(.*\)".*/\1/p' | head -n1)
        if [ -z "$VERSION" ]; then
          echo "Error: Failed to extract version from version.inc"
          exit 1
        fi
        
        # 查找 AppImage 文件
        APPIMAGE_PATH=$(find build -maxdepth 1 -name "OrcaSlicer*.AppImage" -type f | head -n1)
        if [ -z "$APPIMAGE_PATH" ]; then
          echo "Error: No AppImage found in build directory"
          ls -la build/ || true
          exit 1
        fi
        
        FILENAME=$(basename "$APPIMAGE_PATH")
        FILEPATH="build/${FILENAME}"
        
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "filename=${FILENAME}" >> $GITHUB_OUTPUT
        echo "filepath=${FILEPATH}" >> $GITHUB_OUTPUT
        echo "Version: ${VERSION}"
        echo "Filename: ${FILENAME}"
        echo "Filepath: ${FILEPATH}"
    
    - name: Verify AppImage
      shell: bash -e {0}
      run: |
        FILEPATH="${{ steps.version.outputs.filepath }}"
        
        if [ ! -f "$FILEPATH" ]; then
          echo "Error: AppImage file not found at: $FILEPATH"
          echo "Build directory contents:"
          ls -la build/ || true
          exit 1
        fi
        
        echo "✓ AppImage found: $FILEPATH"
        echo ""
        echo "File details:"
        ls -lh "$FILEPATH"
        echo ""
        echo "File type:"
        file "$FILEPATH"
        echo ""
        echo "✓ AppImage is ready for deployment to Ubuntu 24.04 x86_64 servers"
        
        # 显示编译统计
        if command -v ccache &> /dev/null; then
          echo ""
          echo "=== CCache Statistics ==="
          ccache -s
        fi
    
    - name: Upload AppImage as artifact
      uses: actions/upload-artifact@v4
      with:
        name: OrcaSlicer-Ubuntu24.04-x86_64-${{ steps.version.outputs.version }}
        path: build/OrcaSlicer*.AppImage
        if-no-files-found: error
        retention-days: 30
        compression-level: 0  # AppImage 已经压缩，跳过额外压缩以节省时间
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ${{ steps.version.outputs.filepath }}
        draft: false
        prerelease: false
        fail_on_unmatched_files: true
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
