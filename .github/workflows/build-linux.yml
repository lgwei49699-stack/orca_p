name: Build Linux AppImage for x86_64

on:
  workflow_dispatch:
  push:
    tags:
      - 'manual-build-linux-*'

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    # 使用 Ubuntu 24.04 匹配服务器环境
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    
    - name: Free up disk space
      shell: bash -e {0}
      run: |
        echo "=== Before cleanup ==="
        df -h /
        
        # 删除不需要的软件和镜像
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        
        # 清理 apt 缓存
        sudo apt-get clean
        
        echo ""
        echo "=== After cleanup ==="
        df -h /
    
    - name: Setup build info
      shell: bash -e {0}
      run: |
        echo "Building for Ubuntu 24.04 x86_64"
        echo "CPU cores: $(nproc)"
        echo "Available memory: $(free -h | grep Mem | awk '{print $2}')"
        uname -a
        cat /etc/os-release
    
    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-24.04-ccache
        max-size: 2G
        variant: ccache
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          deps/build
          deps/DL_CACHE
        key: ${{ runner.os }}-24.04-deps-${{ hashFiles('deps/CMakeLists.txt', 'deps/**/*.cmake', 'deps/**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-24.04-deps-
          ${{ runner.os }}-deps-
    
    - name: Fix package manager state
      shell: bash -e {0}
      run: |
        sudo apt-get update
        sudo apt-get install -y --fix-broken
        sudo apt-get install -y libunwind-dev ccache binutils curl jq patchelf python3
    
    - name: Install system dependencies
      shell: bash -e {0}
      run: |
        sudo ./build_linux.sh -u

    - name: Install MeshLib dependencies
      shell: bash -e {0}
      run: |
        # Actual SDK ELF dependencies and the adapter's expected<T> header.
        # The full SDK package also pulls unrelated OCCT/viewer/Boost development stacks.
        sudo apt-get install -y \
          libjsoncpp25 libspdlog1.12 libfmt9 libtbb12 libtiff6 \
          libzip4t64 libgdcm3.0t64 libblosc1 libboost-iostreams1.83.0 libexpected-dev

    - name: Prepare pinned MeshLib SDK
      shell: bash -e {0}
      run: |
        SDK_ARCHIVE="${RUNNER_TEMP}/meshlib_v3.1.3.429_ubuntu24-dev.deb"
        SDK_ROOT="${RUNNER_TEMP}/meshlib-sdk"
        curl --fail --location --retry 3 \
          https://github.com/MeshInspector/MeshLib/releases/download/v3.1.3.429/meshlib_v3.1.3.429_ubuntu24-dev.deb \
          --output "$SDK_ARCHIVE"
        echo "e592cf7d9a670d2f5b1fc01ddabb2574044749180f492864c62f37805686d727  $SDK_ARCHIVE" | sha256sum --check --strict
        # Extract privately; do not install the SDK or replace Orca dependencies.
        dpkg-deb --extract "$SDK_ARCHIVE" "$SDK_ROOT"
        echo "ORCA_MESHLIB_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
        echo "ORCA_EXTRA_BUILD_ARGS=-DORCA_MESHLIB_LOCAL_EVALUATION=ON -DORCA_MESHLIB_SDK_ROOT=$SDK_ROOT -DZLIB_USE_STATIC_LIBS=ON" >> "$GITHUB_ENV"
    
    - name: Configure ccache
      shell: bash -e {0}
      run: |
        # 配置 ccache
        ccache --set-config=max_size=2G
        ccache --set-config=compression=true
        ccache --set-config=compression_level=6
        ccache --zero-stats
        
        echo "CCache configured:"
        ccache --show-config
    
    - name: Build dependencies
      shell: bash -e {0}
      run: |
        # 不在依赖构建阶段使用 ccache，避免与某些库的构建系统冲突
        export MAKEFLAGS="-j$(nproc)"
        
        echo "Building dependencies with $(nproc) parallel jobs..."
        ./build_linux.sh -d
    
    - name: Build OrcaSlicer
      shell: bash -e {0}
      run: |
        # 在主程序编译时使用 ccache
        export PATH="/usr/lib/ccache:$PATH"
        export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)
        export CCACHE_DIR="${HOME}/.ccache"
        
        echo "Building OrcaSlicer with $(nproc) parallel jobs and ccache..."
        time ./build_linux.sh -s
    
    - name: Build AppImage
      shell: bash -e {0}
      run: |
        echo "Creating AppImage..."
        time ./build_linux.sh -i
    
    - name: Get version info
      id: version
      shell: bash -e {0}
      run: |
        set -o pipefail
        
        # 提取版本号
        VERSION=$(grep 'SoftFever_VERSION' version.inc | sed -n 's/.*"\(.*\)".*/\1/p' | head -n1)
        if [ -z "$VERSION" ]; then
          echo "Error: Failed to extract version from version.inc"
          exit 1
        fi
        
        # 查找 AppImage 文件
        APPIMAGE_PATH=$(find build -maxdepth 1 -name "OrcaSlicer*.AppImage" -type f | head -n1)
        if [ -z "$APPIMAGE_PATH" ]; then
          echo "Error: No AppImage found in build directory"
          ls -la build/ || true
          exit 1
        fi
        
        FILENAME=$(basename "$APPIMAGE_PATH")
        FILEPATH="build/${FILENAME}"
        
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "filename=${FILENAME}" >> $GITHUB_OUTPUT
        echo "filepath=${FILEPATH}" >> $GITHUB_OUTPUT
        echo "Version: ${VERSION}"
        echo "Filename: ${FILENAME}"
        echo "Filepath: ${FILEPATH}"
    
    - name: Verify relocated MeshLib AppImage without the SDK
      shell: bash -e {0}
      run: |
        # The final package must not fall back to the build machine's SDK.
        mv "$ORCA_MESHLIB_SDK_ROOT" "${ORCA_MESHLIB_SDK_ROOT}.unavailable"
        trap 'mv "${ORCA_MESHLIB_SDK_ROOT}.unavailable" "$ORCA_MESHLIB_SDK_ROOT"' EXIT
        bash scripts/test_linux_meshlib_package.sh \
          "${{ steps.version.outputs.filepath }}" "$RUNNER_TEMP/meshlib-package-check"
        ccache -s

    - name: Upload MeshLib package verification evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: MeshLib-Linux-package-verification-${{ github.run_id }}
        path: |
          ${{ runner.temp }}/meshlib-package-check/**/*.json
          ${{ runner.temp }}/meshlib-package-check/**/*.txt
        if-no-files-found: warn
        retention-days: 30
    
    # Exercise the packaged executable, not just the build-tree binary. This
    # catches missing G-code and incorrect single/multi-plate JSON before release.
    - name: Verify packaged CLI slicing and arrangement
      shell: bash -e {0}
      run: |
        set -o pipefail
        APPIMAGE_PATH="$(realpath '${{ steps.version.outputs.filepath }}')"
        VERIFY_DIR="${RUNNER_TEMP}/orca-cli-slice-check"
        mkdir -p "${VERIFY_DIR}/app"
        chmod +x "${APPIMAGE_PATH}"
        (
          cd "${VERIFY_DIR}/app"
          "${APPIMAGE_PATH}" --appimage-extract > "${VERIFY_DIR}/extract.log"
        )
        sha256sum "${APPIMAGE_PATH}" "${VERIFY_DIR}/app/squashfs-root/bin/orca-slicer" > "${VERIFY_DIR}/identity.txt"
        # Service containers have no display. The slicing contract must work
        # headlessly; do not hide missing output behind a successful exit code.
        env -u DISPLAY -u WAYLAND_DISPLAY python3 scripts/test_cli_fixed_position_slice.py \
          "${VERIFY_DIR}/app/squashfs-root/AppRun" \
          --outputdir "${VERIFY_DIR}/results"
        env -u DISPLAY -u WAYLAND_DISPLAY python3 scripts/test_cli_oversized_arrange.py \
          "${VERIFY_DIR}/app/squashfs-root/AppRun" \
          --machine "${VERIFY_DIR}/results/machine.json" \
          --process "${VERIFY_DIR}/results/process.json" \
          --filament "${VERIFY_DIR}/results/filament.json" \
          --outputdir "${VERIFY_DIR}/arrangement-results"

    - name: Upload CLI slicing evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: OrcaSlicer-Linux-CLI-slicing-evidence
        path: |
          ${{ runner.temp }}/orca-cli-slice-check/results
          ${{ runner.temp }}/orca-cli-slice-check/arrangement-results
          ${{ runner.temp }}/orca-cli-slice-check/identity.txt
          ${{ runner.temp }}/orca-cli-slice-check/extract.log
        if-no-files-found: ignore
        retention-days: 14

    - name: Upload AppImage as artifact
      uses: actions/upload-artifact@v4
      with:
        name: OrcaSlicer-Ubuntu24.04-x86_64-${{ steps.version.outputs.version }}
        path: build/OrcaSlicer*.AppImage
        if-no-files-found: error
        retention-days: 30
        compression-level: 0  # AppImage 已经压缩，跳过额外压缩以节省时间
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/manual-build-linux-')
      with:
        files: ${{ steps.version.outputs.filepath }}
        draft: false
        prerelease: false
        fail_on_unmatched_files: true
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
